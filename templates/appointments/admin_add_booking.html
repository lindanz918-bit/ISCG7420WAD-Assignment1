{% extends '../base.html' %}

{% block content %}
    <h2>Admin Add Booking</h2>

    <!-- Step 1: Doctor Selection Form (Submits GET request on change) -->
    <form method="get" id="doctor-select-form" class="mb-4">
        <div class="mb-3">
            <label for="doctor_id" class="form-label fw-bold">1. Select Doctor:</label>
            <select name="doctor_id" id="doctor_id" class="form-select" onchange="this.form.submit()">
                <option value="">-- Choose Doctor First --</option>
                {% for d in doctors %}
                    <option value="{{ d.id }}" {% if selected_doctor_id == d.id|stringformat:"s" %}selected{% endif %}>
                        Dr. {{ d.first_name }} {{ d.last_name }} @{{ d.username }} ({{ d.specialization }})
                    </option>
                {% endfor %}
            </select>
        </div>
    </form>

    <!-- Step 2: Final Booking Form (POST Request) -->
    <form method="post">
        {% csrf_token %}

        <!-- Patient Selection -->
        <div class="mb-3">
            <label for="user_id" class="form-label fw-bold">2. Select Patient:</label>
            <select name="user_id" id="user_id" class="form-select" required>
                <option value="">-- Select Patient --</option>
                {% for u in users %}
                    <option value="{{ u.id }}">{{ u.first_name }} {{ u.last_name }} @{{ u.username }} ({% if u.email %}{{ u.email }}{% else %}No
                        email{% endif %})
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- Available Slots (Filtered by selected doctor) -->
        <div class="mb-3">
            <label for="slot_id" class="form-label fw-bold">3. Select Available Slot:</label>
            <select name="slot_id" id="slot_id" class="form-select" required
                    {% if not selected_doctor_id %}disabled{% endif %}>
                <option value="">
                    {% if selected_doctor_id %}
                        -- Select Available Time Slot --
                    {% else %}
                        -- Please Select a Doctor Above First --
                    {% endif %}
                </option>
                {% for s in slots %}
                    <option value="{{ s.id }}">
                        {{ s.date|date:"M d, Y" }} at {{ s.time|time:"H:i" }}
                    </option>
                {% empty %}
                    {% if selected_doctor_id %}
                        <option value="" disabled>No available unbooked slots for this doctor</option>
                    {% endif %}
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-primary" {% if not selected_doctor_id %}disabled{% endif %}>
            Confirm Booking
        </button>
        <a href="{% url 'admin_booking_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
