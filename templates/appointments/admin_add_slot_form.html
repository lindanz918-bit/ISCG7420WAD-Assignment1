{% extends '../base.html' %}
{% block title %}{{ title }} - Piki Ora Medical{% endblock %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
            <div class="card-body">
                <h3 class="card-title mb-4">{{ title }}</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">Save Slot</button>
                    <a href="{% url 'admin_slot_list' %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
            </div>
        </div>
    </div>
{% endblock %}
