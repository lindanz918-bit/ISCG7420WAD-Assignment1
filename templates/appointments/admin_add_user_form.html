{% extends '../base.html' %}
{% block title %}{{ title }} - Piki Ora Medical{% endblock %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="card-title mb-4">{{ title }}</h3>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="alert alert-info py-2" role="alert">
                            <i class="bi bi-info-circle"></i> <strong>Note:</strong> The initial password for this
                            account will be automatically set to <code>123456</code>.
                        </div>
                        <button type="submit" class="btn btn-primary">Save User</button>
                        <a href="{% url 'admin_user_list' %}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
