{% extends '../base.html' %}
{% block title %}{{ title }} - Piki Ora Medical{% endblock %}
{% block content %}
    <div>
        <div>
            <div>
                <h2>{{ title }}</h2>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">Save Doctor</button>
                    <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
