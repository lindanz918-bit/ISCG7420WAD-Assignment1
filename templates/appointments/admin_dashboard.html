{% extends '../base.html' %}

{% block title %}Admin Dashboard - Piki Ora Medical{% endblock %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-dark fw-bold">Custom Administrator Dashboard</h2>
        <span class="badge bg-danger fs-6">Admin Panel</span>
    </div>

    <!-- Navigation Tabs -->
    <ul class="nav nav-tabs mb-4" id="adminTab" role="tablist">
        <li class="nav-item">
            <button class="nav-link active fw-bold" id="bookings-tab" data-bs-toggle="tab" data-bs-target="#bookings"
                    type="button">All Patient Bookings
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link fw-bold" id="doctors-tab" data-bs-toggle="tab" data-bs-target="#doctors"
                    type="button">Manage Doctors
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link fw-bold" id="slots-tab" data-bs-toggle="tab" data-bs-target="#slots"
                    type="button">Manage Slots
            </button>
        </li>
    </ul>

{% endblock %}
