{% extends '../base.html' %}

{% block title %}Register - Piki Ora Medical{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 text-primary fw-bold">Patient Registration</h3>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-success w-100 py-2">Create Account</button>
                </form>
                <div class="text-center mt-3">
                    <small>Already registered? <a href="{% url 'login' %}">Log in here</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
